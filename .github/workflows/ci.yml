name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "pm/**"
      - ".fais/**"
      - ".claude/**"
      - ".agents/**"
      - ".codex/**"
      # fais stories live here (.faisrc storiesDir) instead of pm/.
      - "stories/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "pm/**"
      - ".fais/**"
      - ".claude/**"
      - ".agents/**"
      - ".codex/**"
      - "stories/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  test:
    name: Test (Elixir ${{matrix.elixir}} / OTP ${{matrix.otp}})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        elixir: ['1.19']
        otp: ['27']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{matrix.elixir}}
          otp-version: ${{matrix.otp}}

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install Chrome (for chromic_pdf)
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install dependencies
        run: mix deps.get

      - name: Compile dependencies
        run: mix deps.compile

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile code (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Setup test database
        run: mix ecto.create && mix ecto.migrate

      - name: Run tests
        run: mix test
        env:
          CHROMIC_PDF_INIT_TIMEOUT: 30000
          CHROMIC_PDF_TIMEOUT: 30000
          CHROMIC_PDF_CHECKOUT_TIMEOUT: 30000
